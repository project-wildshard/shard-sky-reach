name: ci

on:
  push:
    branches: [main, 'plan/**']
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
      sharddev:
        description: Exact candidate sharddev commit (empty keeps the pin)
        type: string
        default: ''
  repository_dispatch:
    types: [engine-candidate]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.engine || github.event.client_payload.engine }}-${{ inputs.sharddev || github.event.client_payload.sharddev }}
  # A newer push to a plan branch cancels its older run; land reads a
  # cancelled run as red and stops, so push a plan branch only via land.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/plan/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact Ring 3 candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      - name: Bind immutable preparation inputs
        id: preparation-key
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/author-preparation-key.mjs
      - name: Restore verified Ring 2 author preparation
        id: author-preparation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/wildshard/basis
            ~/.cache/wildshard/gen
          key: ${{ steps.preparation-key.outputs.key }}
      - name: Require matching preparation for a candidate
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && steps.author-preparation.outputs.cache-hit != 'true'
        run: |
          echo 'Run ring-2-prepare with these exact engine and sharddev commits first.' >&2
          exit 1
      # The agent hook scripts are shellchecked in pnpm check, at this exact
      # version (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      # MR6: hosted runners are Linux/X64, the Mac mini's VM is Linux/ARM64;
      # each archive is pinned by its own published sha256.
      - name: Install shellcheck 0.11.0
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) arch=x86_64 sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Linux/ARM64) arch=aarch64 sum=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            *) echo "::error::no pinned shellcheck 0.11.0 for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.xz"
          echo "$sum  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: pnpm check
      - name: Keep the cleared queue and public imports honest
        run: node scripts/check-test-boundary.mjs
      - name: Build shard products on the runner
        if: github.event_name != 'push'
        run: pnpm build:shards
      - name: Walk the owned 1800-tick authored route
        if: github.event_name != 'push'
        run: node --experimental-transform-types --test test/ci/owned-journey.test.mjs
      - name: Play the keeper tape through the winch to the Roc
        if: github.event_name != 'push'
        run: node --experimental-transform-types --test test/ci/winch-journey.test.mjs
      - if: github.event_name != 'push'
        run: pnpm test:shards
      - name: Boot, play and resume every built product
        if: github.event_name != 'push'
        run: node --test --test-concurrency=1 test/ci/product-play.test.mjs test/ci/package-products.test.mjs
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pnpm test:hooks
      - name: Name the commits this verdict covers
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI verdict target\n\n%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[] | select(.status == \"completed\" and .conclusion != \"cancelled\" and .id < $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished push run to compare against' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA?per_page=100" \
            --jq '.commits[] | "\(.sha[0:10]) \(.commit.message | split("\n")[0])"')
          {
            printf '\n### Included commits since %s\n\n~~~text\n%s\n~~~\n' "$previous" "$commits"
            echo 'The checks target the final tree; intermediate SHAs were not executed separately.'
          } >> "$GITHUB_STEP_SUMMARY"

  # TEST-SPEED TS16e (repo-kit docs/shard-ci.md): on a push this job builds
  # once, runs check's build-dependent steps on that out/, then plays Ring 2
  # when the push touches what ring-2-prepare.yml's push trigger watched.
  # ring-2-prepare.yml keeps the nightly run and dispatches; check still
  # builds for pull requests and candidates.
  ring-2-prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact Ring 3 candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      # The paths ring-2-prepare.yml's push trigger watched, plus ci.yml.
      # A plan/** push compares against main, not the branch's last tip, so
      # land never fast-forwards a branch whose watched change skipped Ring 2.
      # An unknown base (a main branch's first push, failed compare, 300+
      # files) plays.
      - name: Decide whether this push plays Ring 2
        id: ring2
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ startsWith(github.ref, 'refs/heads/plan/') && 'main' || github.event.before }}
        run: |
          watched='^(\.github/workflows/(ci|ring-2-prepare)\.yml$|\.github/actions/|src/|test/|scripts/|public/|lint/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$|vitest\.config\.[^/]*$|\.npmrc$|\.gitattributes$|\.oxlintrc\.author\.json$)'
          play=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') &&
            [ "$(printf '%s\n' "$files" | grep -c .)" -lt 300 ] &&
            ! printf '%s\n' "$files" | grep -Eq "$watched"; then
            play=false
          fi
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "Ring 2 play on this push: $play"
      - name: Bind immutable preparation inputs
        id: preparation-key
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/author-preparation-key.mjs
      - name: Restore verified preparation inputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/wildshard/basis
            ~/.cache/wildshard/gen
          key: ${{ steps.preparation-key.outputs.key }}
          restore-keys: |
            author-preparation-v2-${{ runner.os }}-${{ runner.arch }}-
            author-preparation-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build shard products on the runner
        run: pnpm build:shards
      - name: Walk the owned 1800-tick authored route
        run: node --experimental-transform-types --test test/ci/owned-journey.test.mjs
      - name: Play the keeper tape through the winch to the Roc
        run: node --experimental-transform-types --test test/ci/winch-journey.test.mjs
      - run: pnpm test:shards
      - name: Boot, play and resume every built product
        run: node --test --test-concurrency=1 test/ci/product-play.test.mjs test/ci/package-products.test.mjs
      - name: Cook and play only served server files
        if: steps.ring2.outputs.play == 'true'
        run: node --test test/ci/cook-play.test.mjs
      # Plan branches restore main's cache but never save their own: a
      # branch's cache is unreadable from main and only crowds the 10 GB limit.
      - name: Save verified author preparation
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/wildshard/basis
            ~/.cache/wildshard/gen
          key: ${{ steps.preparation-key.outputs.key }}

  # SHARD-AUTHORING SA40 (J319): generators are arbitrary Node, so build
  # every shard twice from a clean copy of the tree, each with an empty
  # HOME, and fail when the two products differ by one byte. CI only:
  # `wildshard check` does not run it.
  build-twice:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact Ring 3 candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      - name: Build the shards twice and compare every product byte
        run: pnpm check:build-twice
