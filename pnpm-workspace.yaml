packages:
  - .
# GVS G9 (J230): installs link into pnpm's global virtual store. confirmModulesPurge: false
# lets an existing classic checkout move over on a non-TTY install.
enableGlobalVirtualStore: true
confirmModulesPurge: false
packageExtensions:
  '@wildshard/engine':
    dependencies:
      '@typescript/typescript6': '6.0.2'
      vite: '8.3.0'
      sharp: '0.35.5'

# Install scripts (SA39, J319): a dependency runs its preinstall, install or
# postinstall script only when it is listed `true` here. pnpm skips the rest and
# names them after `pnpm install`. Nothing this shard installs needs one today.
allowBuilds: {}
